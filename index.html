<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapPet</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --primary: #2d9a4e;
      --bg: #f8faf8;
      --text: #1a2e1d;
      --secondary: #4a6550;
      --muted: #8fa896;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lang-selector {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 20;
      font-size: 13px;
      line-height: 1.4;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0;
    }

    .lang-selector a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-weight: normal;
      transition: color 0.15s ease;
    }

    .lang-selector a:hover {
      color: var(--primary);
    }

    .lang-selector a.active {
      color: var(--primary);
      font-weight: bold;
    }

    .lang-selector img {
      width: 16px;
      height: 12px;
      display: block;
      border-radius: 1px;
      object-fit: cover;
    }

    .lang-selector .sep {
      color: var(--muted);
      margin: 0 6px;
      user-select: none;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px 100px;
      max-width: 560px;
      width: 100%;
    }

    .paw {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 36px;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 18px;
      color: var(--secondary);
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 32px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .store-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .store-buttons a {
      display: inline-block;
      line-height: 0;
      transition: transform 0.15s ease;
    }

    .store-buttons a:hover {
      transform: translateY(-2px);
    }

    .store-buttons img {
      height: 60px;
      width: auto;
      display: block;
    }

    .availability {
      font-size: 13px;
      color: var(--secondary);
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #e8f5ec;
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-block;
      max-width: 100%;
      line-height: 1.4;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      text-align: center;
      background: var(--bg);
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    footer a {
      color: var(--secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    footer .sep {
      color: var(--muted);
      margin: 0 8px;
    }

    @media (max-width: 480px) {
      .lang-selector {
        right: 8px;
        left: 8px;
        text-align: center;
        top: 8px;
      }

      .main {
        padding-top: 72px;
      }
    }
  </style>
</head>
<body>
  <nav class="lang-selector" aria-label="Language">
    <a href="#" data-lang="pt" onclick="return setLanguage('pt')"><img src="https://flagcdn.com/16x12/pt.png" width="16" height="12" alt="PT"> PT</a><span class="sep">·</span>
    <a href="#" data-lang="en" onclick="return setLanguage('en')"><img src="https://flagcdn.com/16x12/gb.png" width="16" height="12" alt="EN"> EN</a><span class="sep">·</span>
    <a href="#" data-lang="es" onclick="return setLanguage('es')"><img src="https://flagcdn.com/16x12/es.png" width="16" height="12" alt="ES"> ES</a><span class="sep">·</span>
    <a href="#" data-lang="de" onclick="return setLanguage('de')"><img src="https://flagcdn.com/16x12/de.png" width="16" height="12" alt="DE"> DE</a><span class="sep">·</span>
    <a href="#" data-lang="fr" onclick="return setLanguage('fr')"><img src="https://flagcdn.com/16x12/fr.png" width="16" height="12" alt="FR"> FR</a>
  </nav>

  <main class="main">
    <div class="paw" aria-hidden="true">🐾</div>
    <h1>MapPet</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="store-buttons">
      <a href="https://play.google.com/store/apps/details?id=com.savagesimplicity.mappet"
         target="_blank" rel="noopener noreferrer">
        <img
          src="https://play.google.com/intl/en_us/badges/static/images/badges/pt_badge_web_generic.png"
          alt="Disponível no Google Play"
          style="height: 60px;"
        />
      </a>
    </div>
    <div class="availability" data-i18n="availability"></div>
  </main>

  <footer>
    <a href="/privacy.html" data-i18n="privacy"></a><span class="sep">·</span>
    <a href="/terms.html" data-i18n="terms"></a><span class="sep">·</span>
    <a href="/cookies.html" data-i18n="cookies"></a><span class="sep">·</span>
    <a href="/faq.html" data-i18n="faq"></a><span class="sep">·</span>
    <a href="/privacy-request.html" data-i18n="privacy_request"></a><span class="sep">·</span>
    <a href="/delete-account.html" data-i18n="delete_account"></a><span class="sep">·</span>
    <a href="mailto:support@mappet.app" data-i18n="support"></a>
  </footer>

  <script>
    const translations = {
      pt: {
        tagline: "Descobre cafés, parques, praias e muito mais locais que aceitam o teu animal de estimação.",
        privacy: "Privacidade",
        terms: "Termos",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Dados pessoais",
        delete_account: "Eliminar conta",
        support: "Suporte",
        availability: "📍 Disponível em Portugal 🇵🇹 · A expandir para mais países em breve"
      },
      en: {
        tagline: "Discover cafés, parks, beaches and many more places that welcome your pet.",
        privacy: "Privacy",
        terms: "Terms",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Personal data",
        delete_account: "Delete account",
        support: "Support",
        availability: "📍 Available in Portugal 🇵🇹 · Expanding to more countries soon"
      },
      es: {
        tagline: "Descubre cafés, parques, playas y muchos más lugares que aceptan a tu mascota.",
        privacy: "Privacidad",
        terms: "Términos",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Datos personales",
        delete_account: "Eliminar cuenta",
        support: "Soporte",
        availability: "📍 Disponible en Portugal 🇵🇹 · Próximamente en más países"
      },
      de: {
        tagline: "Entdecke Cafés, Parks, Strände und viele weitere Orte, die dein Haustier willkommen heißen.",
        privacy: "Datenschutz",
        terms: "Nutzungsbedingungen",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Personenbezogene Daten",
        delete_account: "Konto löschen",
        support: "Support",
        availability: "📍 Verfügbar in Portugal 🇵🇹 · Bald in weiteren Ländern"
      },
      fr: {
        tagline: "Découvrez des cafés, parcs, plages et bien d'autres endroits qui accueillent votre animal.",
        privacy: "Confidentialité",
        terms: "Conditions",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Données personnelles",
        delete_account: "Supprimer le compte",
        support: "Support",
        availability: "📍 Disponible au Portugal 🇵🇹 · Bientôt dans d'autres pays"
      }
    };

    const supported = ['pt', 'en', 'es', 'de', 'fr'];

    function setLanguage(lang) {
      if (!supported.includes(lang)) lang = 'pt';
      localStorage.setItem('mappet_lang', lang);
      document.documentElement.lang = lang;

      const t = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });

      document.querySelectorAll('.lang-selector a[data-lang]').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-lang') === lang);
      });

      return false;
    }

    (function init() {
      const stored = localStorage.getItem('mappet_lang');
      const browserLang = navigator.language.slice(0, 2);
      const defaultLang = supported.includes(browserLang) ? browserLang : 'pt';
      const lang = (stored && supported.includes(stored)) ? stored : defaultLang;
      setLanguage(lang);
    })();
  </script>
</body>
</html>
