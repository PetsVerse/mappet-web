<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapPet</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    :root {
      --primary: #2d9a4e;
      --bg: #f8faf8;
      --text: #1a2e1d;
      --secondary: #4a6550;
      --muted: #8fa896;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lang-selector {
      position: fixed;
      top: 44px;
      right: 16px;
      z-index: 20;
      font-size: 13px;
      line-height: 1.4;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0;
    }

    .lang-selector a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-weight: normal;
      transition: color 0.15s ease;
    }

    .lang-selector a:hover {
      color: var(--primary);
    }

    .lang-selector a.active {
      color: var(--primary);
      font-weight: bold;
    }

    .lang-selector img {
      width: 16px;
      height: 12px;
      display: block;
      border-radius: 1px;
      object-fit: cover;
    }

    .lang-selector .sep {
      color: var(--muted);
      margin: 0 6px;
      user-select: none;
    }

    .live-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 15;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      text-align: center;
      padding: 10px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 600;
    }

    .page {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 24px 100px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    .app-icon {
      width: 88px;
      height: 88px;
      margin-bottom: 16px;
      border-radius: 22%;
      object-fit: cover;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 36px;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 18px;
      color: var(--secondary);
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .features {
      max-width: 800px;
      width: 100%;
      margin: 48px auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .feature-card {
      background: #f8faf8;
      border: 1px solid #e0ebe3;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .feature-icon {
      font-size: 28px;
      line-height: 1;
      margin-bottom: 12px;
      display: block;
    }

    .feature-card h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .feature-card p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--secondary);
    }

    .about {
      max-width: 600px;
      width: 100%;
      margin: 48px auto;
      text-align: center;
    }

    .about h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-style: normal;
    }

    .about p {
      font-size: 15px;
      line-height: 1.7;
      color: #4a6550;
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
    }

    .cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 16px;
    }

    .store-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .store-buttons a {
      display: inline-block;
      line-height: 0;
      transition: transform 0.15s ease;
    }

    .store-buttons a:hover {
      transform: translateY(-2px);
    }

    .store-buttons img {
      height: 60px;
      width: auto;
      display: block;
    }

    .availability {
      font-size: 13px;
      color: var(--secondary);
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #e8f5ec;
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-block;
      max-width: 100%;
      line-height: 1.4;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      text-align: center;
      background: var(--bg);
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    footer a {
      color: var(--secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    footer .sep {
      color: var(--muted);
      margin: 0 8px;
    }

    @media (max-width: 600px) {
      .features {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .lang-selector {
        right: 8px;
        left: 8px;
        text-align: center;
        top: 40px;
        justify-content: center;
      }

      .live-banner {
        font-size: 13px;
        padding: 8px 12px;
      }

      .page {
        padding-top: 96px;
      }
    }
  </style>
</head>
<body>
  <div class="live-banner" data-i18n="live_banner"></div>

  <nav class="lang-selector" aria-label="Language">
    <a href="#" data-lang="pt" onclick="return setLanguage('pt')"><img src="https://flagcdn.com/16x12/pt.png" width="16" height="12" alt="PT"> PT</a><span class="sep">·</span>
    <a href="#" data-lang="en" onclick="return setLanguage('en')"><img src="https://flagcdn.com/16x12/gb.png" width="16" height="12" alt="EN"> EN</a><span class="sep">·</span>
    <a href="#" data-lang="es" onclick="return setLanguage('es')"><img src="https://flagcdn.com/16x12/es.png" width="16" height="12" alt="ES"> ES</a><span class="sep">·</span>
    <a href="#" data-lang="de" onclick="return setLanguage('de')"><img src="https://flagcdn.com/16x12/de.png" width="16" height="12" alt="DE"> DE</a><span class="sep">·</span>
    <a href="#" data-lang="fr" onclick="return setLanguage('fr')"><img src="https://flagcdn.com/16x12/fr.png" width="16" height="12" alt="FR"> FR</a>
  </nav>

  <div class="page">
    <section class="hero">
      <img class="app-icon" src="/android-chrome-192x192.png" width="192" height="192" alt="MapPet">
      <h1>MapPet</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </section>

    <section class="features" aria-label="Features">
      <article class="feature-card">
        <span class="feature-icon" aria-hidden="true">🗺️</span>
        <h2 data-i18n="feature1_title"></h2>
        <p data-i18n="feature1_text"></p>
      </article>
      <article class="feature-card">
        <span class="feature-icon" aria-hidden="true">✓</span>
        <h2 data-i18n="feature2_title"></h2>
        <p data-i18n="feature2_text"></p>
      </article>
      <article class="feature-card">
        <span class="feature-icon" aria-hidden="true">📍</span>
        <h2 data-i18n="feature3_title"></h2>
        <p data-i18n="feature3_text"></p>
      </article>
    </section>

    <section class="about">
      <h2 data-i18n="about_title"></h2>
      <p data-i18n="about_text"></p>
    </section>

    <section class="cta">
      <div class="store-buttons">
        <a href="https://apps.apple.com/app/id6792010147"
           target="_blank" rel="noopener noreferrer">
          <img
            src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/pt-pt?size=250x83"
            alt="Descarregar na App Store"
            style="height: 60px;"
          />
        </a>
        <a href="https://play.google.com/store/apps/details?id=com.savagesimplicity.mappet"
           target="_blank" rel="noopener noreferrer">
          <img
            src="https://play.google.com/intl/en_us/badges/static/images/badges/pt_badge_web_generic.png"
            alt="Disponível no Google Play"
            style="height: 60px;"
          />
        </a>
      </div>
      <div class="availability" data-i18n="availability"></div>
    </section>
  </div>

  <footer>
    <a href="/privacy.html" data-i18n="privacy"></a><span class="sep">·</span>
    <a href="/terms.html" data-i18n="terms"></a><span class="sep">·</span>
    <a href="/cookies.html" data-i18n="cookies"></a><span class="sep">·</span>
    <a href="/faq.html" data-i18n="faq"></a><span class="sep">·</span>
    <a href="/privacy-request.html" data-i18n="privacy_request"></a><span class="sep">·</span>
    <a href="/delete-account.html" data-i18n="delete_account"></a><span class="sep">·</span>
    <a href="mailto:support@mappet.app" data-i18n="support"></a>
  </footer>

        delete_account: "Eliminar conta",

      es: {

        feature1_title: "Descubre lugares pet-friendly",
        feature1_text: "Más de 8.000 lugares en Portugal — parques, cafés, playas, restaurantes y mucho más que aceptan a tu mascota.",
        feature2_title: "Confirmado por la comunidad",
        feature2_text: "Cada lugar es verificado por tutores reales. Votos, comentarios y fotos de la comunidad te ayudan a elegir mejor.",
        feature3_title: "Contribuye a la comunidad",
        feature3_text: "¿Conoces un lugar pet-friendly que no está en el mapa? Añádelo y ayuda a otros tutores a descubrirlo.",

        terms: "Términos",

        delete_account: "Eliminar cuenta",

      },
      de: {
        live_banner: "🎉 Jetzt im App Store und bei Google Play!",
        tagline: "Die tierfreundliche Karte von der Community",
        feature1_title: "Entdecke tierfreundliche Orte",
        feature1_text: "Über 8.000 Orte in Portugal — Parks, Cafés, Strände, Restaurants und vieles mehr, die dein Haustier willkommen heißen.",

        privacy: "Datenschutz",
        terms: "Nutzungsbedingungen",

        faq: "FAQ",

        delete_account: "Konto löschen",

      fr: {
        live_banner: "🎉 Déjà disponible sur l'App Store et Google Play !",

        feature2_title: "Confirmé par la communauté",
        feature2_text: "Chaque lieu est vérifié par de vrais propriétaires. Votes, commentaires et photos de la communauté vous aident à mieux choisir.",

        feature3_text: "Vous connaissez un lieu pet-friendly qui n'est pas sur la carte ? Ajoutez-le et aidez d'autres propriétaires à le découvrir.",

        about_text: "MapPet est né de l'expérience d'un vétérinaire portugais avec 18 ans de pratique. Chaque jour, je voyais des propriétaires d'animaux inquiets qui ne savaient pas où ils pouvaient aller avec leurs animaux. J'ai créé MapPet pour changer cela — un guide honnête, fait par la communauté, de lieux qui accueillent vraiment nos animaux.",

        delete_account: "Supprimer le compte",
        support: "Support",
        availability: "📍 Disponible sur l'App Store et Google Play · Portugal 🇵🇹"
      }
    };

    const supported = ['pt', 'en', 'es', 'de', 'fr'];

    function setLanguage(lang) {
      if (!supported.includes(lang)) lang = 'pt';
      localStorage.setItem('mappet_lang', lang);
      document.documentElement.lang = lang;

      const t = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });

      document.querySelectorAll('.lang-selector a[data-lang]').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-lang') === lang);
      });

      return false;
    }

    (function init() {
      const stored = localStorage.getItem('mappet_lang');
      const browserLang = navigator.language.slice(0, 2);
      const defaultLang = supported.includes(browserLang) ? browserLang : 'pt';
      const lang = (stored && supported.includes(stored)) ? stored : defaultLang;
      setLanguage(lang);
    })();
  </script>
</body>
</html>
