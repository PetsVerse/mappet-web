<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapPet — Download</title>
  <style>
    :root {
      --primary: #2d9a4e;
      --bg: #f8faf8;
      --text: #1a2e1d;
      --secondary: #4a6550;
      --muted: #8fa896;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 72px;
    }

    .lang-selector {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 20;
      font-size: 13px;
      line-height: 1.4;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0;
    }

    .lang-selector a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-weight: normal;
      transition: color 0.15s ease;
    }

    .lang-selector a:hover {
      color: var(--primary);
    }

    .lang-selector a.active {
      color: var(--primary);
      font-weight: bold;
    }

    .lang-selector img {
      width: 16px;
      height: 12px;
      display: block;
      border-radius: 1px;
      object-fit: cover;
    }

    .lang-selector .sep {
      color: var(--muted);
      margin: 0 6px;
      user-select: none;
    }

    .site-header {
      width: 100%;
      background: var(--primary);
      margin-top: 44px;
      padding: 14px 24px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .site-header a {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .site-header a:hover {
      opacity: 0.9;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      max-width: 560px;
      width: 100%;
      min-height: calc(100vh - 44px - 52px - 72px);
    }

    .paw {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 32px;
      color: var(--primary);
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 17px;
      color: var(--secondary);
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 32px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .store-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 16px;
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: system-ui, -apple-system, sans-serif;
      transition: transform 0.15s ease, opacity 0.15s ease;
      min-width: 220px;
    }

    .store-btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .store-btn svg {
      flex-shrink: 0;
    }

    .store-btn--apple {
      background: #000;
    }

    .store-btn--google {
      background: #1a1a1a;
    }

    .redirecting {
      font-size: 14px;
      color: var(--muted);
      font-family: system-ui, -apple-system, sans-serif;
      margin-bottom: 24px;
      min-height: 1.4em;
    }

    .redirecting[hidden] {
      display: none;
    }

    .availability {
      font-size: 13px;
      color: var(--secondary);
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #e8f5ec;
      padding: 8px 16px;
      border-radius: 999px;
      display: inline-block;
      max-width: 100%;
      line-height: 1.4;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      text-align: center;
      background: var(--bg);
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    footer a {
      color: var(--secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    footer .sep {
      color: var(--muted);
      margin: 0 8px;
    }

    @media (max-width: 480px) {
      .lang-selector {
        right: 8px;
        left: 8px;
        text-align: center;
        top: 8px;
        justify-content: center;
      }

      .site-header {
        margin-top: 40px;
      }

      h1 {
        font-size: 26px;
      }

      .store-buttons {
        flex-direction: column;
        width: 100%;
      }

      .store-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="lang-selector" aria-label="Language">
    <a href="#" data-lang="pt" onclick="return setLanguage('pt')"><img src="https://flagcdn.com/16x12/pt.png" width="16" height="12" alt="PT"> PT</a><span class="sep">·</span>
    <a href="#" data-lang="en" onclick="return setLanguage('en')"><img src="https://flagcdn.com/16x12/gb.png" width="16" height="12" alt="EN"> EN</a><span class="sep">·</span>
    <a href="#" data-lang="es" onclick="return setLanguage('es')"><img src="https://flagcdn.com/16x12/es.png" width="16" height="12" alt="ES"> ES</a><span class="sep">·</span>
    <a href="#" data-lang="de" onclick="return setLanguage('de')"><img src="https://flagcdn.com/16x12/de.png" width="16" height="12" alt="DE"> DE</a><span class="sep">·</span>
    <a href="#" data-lang="fr" onclick="return setLanguage('fr')"><img src="https://flagcdn.com/16x12/fr.png" width="16" height="12" alt="FR"> FR</a>
  </nav>

  <header class="site-header">
    <a href="/">🐾 MapPet</a>
  </header>

  <main class="main">
    <div class="paw" aria-hidden="true">🐾</div>
    <h1 data-i18n="title"></h1>
    <p class="subtitle" data-i18n="subtitle"></p>

    <div class="store-buttons" id="store-buttons">
      <a class="store-btn store-btn--apple" id="btn-ios" href="#" target="_blank" rel="noopener noreferrer">
        <svg width="18" height="22" viewBox="0 0 18 22" fill="currentColor" aria-hidden="true"><path d="M14.76 11.65c-.02-2.14 1.75-3.17 1.83-3.22-1-1.46-2.55-1.66-3.1-1.68-1.32-.13-2.58.78-3.25.78-.67 0-1.71-.76-2.81-.74-1.45.02-2.78.84-3.52 2.14-1.5 2.61-.38 6.47 1.08 8.58.71 1.03 1.56 2.19 2.68 2.15 1.07-.04 1.48-.69 2.77-.69 1.3 0 1.66.69 2.8.67 1.16-.02 1.89-1.05 2.6-2.09.82-1.2 1.15-2.36 1.17-2.42-.03-.01-2.24-.86-2.26-3.41zM12.4 4.9c.59-.72.99-1.71.88-2.7-.85.03-1.88.57-2.49 1.28-.55.63-1.03 1.64-.9 2.61.95.07 1.92-.48 2.51-1.19z"/></svg>
        <span data-i18n="appstore"></span>
      </a>
      <a class="store-btn store-btn--google" id="btn-android" href="#" target="_blank" rel="noopener noreferrer">
        <svg width="18" height="20" viewBox="0 0 18 20" fill="currentColor" aria-hidden="true"><path d="M.5 1.3v17.4c0 .5.5.8.9.6l9.7-5.5L.5 1.3zm11.5 6.6L2.8.4C3.1.1 3.6.1 4 .3l9.3 5.3-1.3 2.3zM4 .3l10.6 6 2.1-1.2c.8-.4.8-1.6 0-2.1L4 .3zm9.5 12.4L4 19.7c-.4.2-.9.2-1.2-.1l10.7-6.1 1.3 2.3c.4.6-.1 1.4-.8 1.1l-.5-.2z"/></svg>
        <span data-i18n="playstore"></span>
      </a>
    </div>

    <p class="redirecting" id="redirecting" hidden data-i18n="redirecting"></p>

    <div class="availability">📍 <span data-i18n="availability"></span></div>
  </main>

  <footer>
    <a href="/privacy.html" data-i18n="privacy"></a><span class="sep">·</span>
    <a href="/terms.html" data-i18n="terms"></a><span class="sep">·</span>
    <a href="/cookies.html" data-i18n="cookies"></a><span class="sep">·</span>
    <a href="/faq.html" data-i18n="faq"></a><span class="sep">·</span>
    <a href="/privacy-request.html" data-i18n="privacy_request"></a><span class="sep">·</span>
    <a href="/delete-account.html" data-i18n="delete_account"></a><span class="sep">·</span>
    <a href="mailto:support@mappet.app" data-i18n="support"></a>
  </footer>

  <script>
    const IOS_URL = 'https://apps.apple.com/app/id6792010147';
    const ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.savagesimplicity.mappet';

    const translations = {
      pt: {
        title: "Descarregar o MapPet",
        subtitle: "O guia pet-friendly de Portugal e Europa",
        redirecting: "A redirecionar para a store...",
        appstore: "Descarregar na App Store",
        playstore: "Descarregar no Google Play",
        availability: "Disponível na App Store e Google Play · Portugal 🇵🇹",
        privacy: "Privacidade",
        terms: "Termos",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Dados pessoais",
        delete_account: "Eliminar conta",
        support: "Suporte",
        document_title: "MapPet — Descarregar"
      },
      en: {
        title: "Download MapPet",
        subtitle: "The pet-friendly guide for Portugal and Europe",
        redirecting: "Redirecting to the store...",
        appstore: "Download on the App Store",
        playstore: "Get it on Google Play",
        availability: "Available on the App Store and Google Play · Portugal 🇵🇹",
        privacy: "Privacy",
        terms: "Terms",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Personal data",
        delete_account: "Delete account",
        support: "Support",
        document_title: "MapPet — Download"
      },
      es: {
        title: "Descargar MapPet",
        subtitle: "La guía pet-friendly de Portugal y Europa",
        redirecting: "Redirigiendo a la tienda...",
        appstore: "Descargar en App Store",
        playstore: "Disponible en Google Play",
        availability: "Disponible en App Store y Google Play · Portugal 🇵🇹",
        privacy: "Privacidad",
        terms: "Términos",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Datos personales",
        delete_account: "Eliminar cuenta",
        support: "Soporte",
        document_title: "MapPet — Descargar"
      },
      de: {
        title: "MapPet herunterladen",
        subtitle: "Der tierfreundliche Reiseführer für Portugal und Europa",
        redirecting: "Weiterleitung zum Store...",
        appstore: "Im App Store laden",
        playstore: "Bei Google Play laden",
        availability: "Im App Store und bei Google Play · Portugal 🇵🇹",
        privacy: "Datenschutz",
        terms: "Nutzungsbedingungen",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Personenbezogene Daten",
        delete_account: "Konto löschen",
        support: "Support",
        document_title: "MapPet — Herunterladen"
      },
      fr: {
        title: "Télécharger MapPet",
        subtitle: "Le guide pet-friendly du Portugal et de l'Europe",
        redirecting: "Redirection vers le store...",
        appstore: "Télécharger sur l'App Store",
        playstore: "Disponible sur Google Play",
        availability: "Disponible sur l'App Store et Google Play · Portugal 🇵🇹",
        privacy: "Confidentialité",
        terms: "Conditions",
        cookies: "Cookies",
        faq: "FAQ",
        privacy_request: "Données personnelles",
        delete_account: "Supprimer le compte",
        support: "Support",
        document_title: "MapPet — Télécharger"
      }
    };

    const supported = ['pt', 'en', 'es', 'de', 'fr'];

    function setLanguage(lang) {
      if (!supported.includes(lang)) lang = 'pt';
      localStorage.setItem('mappet_lang', lang);
      document.documentElement.lang = lang;

      const t = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });

      if (t.document_title) document.title = t.document_title;

      document.querySelectorAll('.lang-selector a[data-lang]').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-lang') === lang);
      });

      return false;
    }

    (function init() {
      const stored = localStorage.getItem('mappet_lang');
      const browserLang = navigator.language.slice(0, 2);
      const defaultLang = supported.includes(browserLang) ? browserLang : 'pt';
      const lang = (stored && supported.includes(stored)) ? stored : defaultLang;
      setLanguage(lang);

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);

      const btnIos = document.getElementById('btn-ios');
      const btnAndroid = document.getElementById('btn-android');
      const redirecting = document.getElementById('redirecting');

      btnIos.href = IOS_URL;
      btnAndroid.href = ANDROID_URL;

      if (isIOS) {
        redirecting.hidden = false;
        setTimeout(function () {
          window.location.href = IOS_URL;
        }, 1500);
      } else if (isAndroid) {
        redirecting.hidden = false;
        setTimeout(function () {
          window.location.href = ANDROID_URL;
        }, 1500);
      }
      // desktop: both buttons visible, no redirect
    })();
  </script>
</body>
</html>
