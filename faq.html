<head>

  <style>
    :root {
      --primary: #2d9a4e;
      --bg: #f8faf8;
      --text: #1a2e1d;
      --secondary: #4a6550;
      --muted: #8fa896;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 72px;
    }

    .lang-selector {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 20;
      font-size: 13px;
      line-height: 1.4;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0;
    }

    .lang-selector a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-weight: normal;
      transition: color 0.15s ease;
    }

    .lang-selector a:hover {
      color: var(--primary);
    }

    .lang-selector a.active {
      color: var(--primary);
      font-weight: bold;
    }

    .lang-selector img {
      width: 16px;
      height: 12px;
      display: block;
      border-radius: 1px;
      object-fit: cover;
    }

    .lang-selector .sep {
      color: var(--muted);
      margin: 0 6px;
      user-select: none;
    }

    .site-header {
      width: 100%;
      background: var(--primary);
      margin-top: 44px;
      padding: 14px 24px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .site-header a {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .site-header a:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      color: var(--text);
      font-weight: bold;
      margin-bottom: 32px;
      letter-spacing: -0.02em;
    }

    .faq-category {
      margin-bottom: 28px;
    }

    .faq-category h2 {
      font-size: 18px;
      color: var(--primary);
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .accordion {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .accordion-item {
      background: #fff;
      border: 1px solid #e0ebe3;
      border-radius: 10px;
      overflow: hidden;
    }

    .accordion-item.open {
      border-color: #c5e5cf;
    }

    .accordion-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.45;
    }

    .accordion-trigger:hover {
      background: #f4faf6;
    }

    .accordion-item.open .accordion-trigger {
      background: #e8f5ec;
    }

    .accordion-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e8f5ec;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      transition: transform 0.2s ease, background 0.15s ease;
    }

    .accordion-item.open .accordion-icon {
      background: var(--primary);
      color: #fff;
      transform: rotate(45deg);
    }

    .accordion-panel {
      display: none;
      padding: 0 18px 16px;
      font-size: 15px;
      color: var(--secondary);
      line-height: 1.65;
    }

    .accordion-item.open .accordion-panel {
      display: block;
    }

    .accordion-panel a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .accordion-panel a:hover {
      text-decoration: underline;
    }

    .contact-section {
      margin-top: 36px;
      background: #e8f5ec;
      border: 1px solid #c5e5cf;
      border-radius: 12px;
      padding: 24px;
    }

    .contact-section h2 {
      font-size: 20px;
      color: var(--text);
      margin-bottom: 10px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .contact-section p {
      font-size: 15px;
      color: var(--secondary);
      line-height: 1.65;
    }

    .contact-section a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .contact-section a:hover {
      text-decoration: underline;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      text-align: center;
      background: var(--bg);
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      border-top: 1px solid #e0ebe3;
      z-index: 10;
    }

    footer a {
      color: var(--secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    footer .sep {
      color: var(--muted);
      margin: 0 8px;
    }

    @media (max-width: 480px) {
      .lang-selector {
        right: 8px;
        left: 8px;
        justify-content: center;
        top: 8px;
      }

      .site-header {
        margin-top: 40px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

    const supported = ['pt', 'en', 'es', 'de', 'fr'];

    function setLanguage(lang) {
      if (!supported.includes(lang)) lang = 'pt';
      localStorage.setItem('mappet_lang', lang);
      document.documentElement.lang = lang;

      const t = translations[lang];

      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined && typeof t[key] === 'string') {
          el.textContent = t[key];
        }
      });

      document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
        const key = el.getAttribute('data-i18n-html');
        if (t[key] !== undefined && typeof t[key] === 'string') {
          el.innerHTML = t[key];
        }
      });

      if (t.document_title) document.title = t.document_title;

      document.querySelectorAll('.lang-selector a[data-lang]').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-lang') === lang);
      });

      return false;
    }

    function initAccordion() {
      document.querySelectorAll('.accordion-trigger').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const item = btn.closest('.accordion-item');
          const isOpen = item.classList.contains('open');

          item.parentElement.querySelectorAll('.accordion-item.open').forEach(function (openItem) {
            if (openItem !== item) {
              openItem.classList.remove('open');
              openItem.querySelector('.accordion-trigger').setAttribute('aria-expanded', 'false');
            }
          });

          item.classList.toggle('open', !isOpen);
          btn.setAttribute('aria-expanded', !isOpen ? 'true' : 'false');
        });
      });
    }

    (function init() {
      const stored = localStorage.getItem('mappet_lang');
      const browserLang = navigator.language.slice(0, 2);
      const defaultLang = supported.includes(browserLang) ? browserLang : 'pt';
      const lang = (stored && supported.includes(stored)) ? stored : defaultLang;
      setLanguage(lang);
      initAccordion();
    })();
  </script>
