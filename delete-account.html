<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapPet — Eliminar Conta</title>
  <style>
    :root {
      --primary: #2d9a4e;
      --bg: #f8faf8;
      --text: #1a2e1d;
      --secondary: #4a6550;
      --muted: #8fa896;
      --warning: #f97316;
      --warning-bg: #fff7ed;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 72px;
    }

    .lang-selector {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 20;
      font-size: 13px;
      line-height: 1.4;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0;
    }

    .lang-selector a {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--muted);
      font-weight: normal;
      transition: color 0.15s ease;
    }

    .lang-selector a:hover {
      color: var(--primary);
    }

    .lang-selector a.active {
      color: var(--primary);
      font-weight: bold;
    }

    .lang-selector img {
      width: 16px;
      height: 12px;
      display: block;
      border-radius: 1px;
      object-fit: cover;
    }

    .lang-selector .sep {
      color: var(--muted);
      margin: 0 6px;
      user-select: none;
    }

    .site-header {
      width: 100%;
      background: var(--primary);
      margin-top: 44px;
      padding: 14px 24px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .site-header a {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .site-header a:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 8px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      color: var(--text);
      font-weight: bold;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .warning-box {
      background: var(--warning-bg);
      border: 1px solid var(--warning);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 36px;
      font-size: 15px;
      color: var(--text);
      line-height: 1.65;
    }

    .content-section {
      margin-bottom: 32px;
    }

    .content-section > h2 {
      font-size: 22px;
      color: var(--primary);
      margin-bottom: 16px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .content-section h3 {
      font-size: 16px;
      color: var(--text);
      margin: 0 0 14px;
      font-weight: 700;
    }

    .content-section p {
      font-size: 15px;
      color: var(--secondary);
      line-height: 1.65;
      margin-bottom: 10px;
    }

    .content-section ul {
      margin: 8px 0 12px 1.25em;
      color: var(--secondary);
      font-size: 15px;
      line-height: 1.65;
    }

    .content-section li {
      margin-bottom: 4px;
    }

    .steps {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .steps li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 15px;
      color: var(--secondary);
      line-height: 1.5;
    }

    .step-num {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .contact-line {
      font-size: 15px;
      color: var(--secondary);
      line-height: 1.65;
      margin-top: 8px;
    }

    .contact-line a {
      color: var(--primary);
      text-decoration: none;
    }

    .contact-line a:hover {
      text-decoration: underline;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      text-align: center;
      background: var(--bg);
      font-size: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      border-top: 1px solid #e0ebe3;
      z-index: 10;
    }

    footer a {
      color: var(--secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    footer .sep {
      color: var(--muted);
      margin: 0 8px;
    }

    @media (max-width: 480px) {
      .lang-selector {
        right: 8px;
        left: 8px;
        justify-content: center;
        top: 8px;
      }

      .site-header {
        margin-top: 40px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <nav class="lang-selector" aria-label="Language">

    <a href="#" data-lang="en" onclick="return setLanguage('en')"><img src="https://flagcdn.com/16x12/gb.png" width="16" height="12" alt="EN"> EN</a><span class="sep">·</span>

    <section class="content-section">

    <section class="content-section">

    </section>

    <section class="content-section">

    <p class="contact-line">
      <span data-i18n="contact_prefix"></span>
      <a href="mailto:support@mappet.app">support@mappet.app</a>
    </p>
  </main>

        privacy: "Confidentialité",
        terms: "Conditions",
        delete_account: "Supprimer le compte",
        support: "Support"

    const supported = ['pt', 'en', 'es', 'de', 'fr'];

    function setLanguage(lang) {
      if (!supported.includes(lang)) lang = 'pt';
      localStorage.setItem('mappet_lang', lang);
      document.documentElement.lang = lang;

      const t = translations[lang];

      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined && typeof t[key] === 'string') {
          el.textContent = t[key];
        }
      });

      document.querySelectorAll('[data-i18n-list]').forEach(function (ul) {
        const key = ul.getAttribute('data-i18n-list');
        const items = t[key];
        if (Array.isArray(items)) {
          ul.innerHTML = items.map(function (item) {
            return '<li>' + item + '</li>';
          }).join('');
        }
      });

      document.querySelectorAll('[data-i18n-steps]').forEach(function (ol) {
        const key = ol.getAttribute('data-i18n-steps');
        const items = t[key];
        if (Array.isArray(items)) {
          ol.innerHTML = items.map(function (item, i) {
            return '<li><span class="step-num">' + (i + 1) + '</span><span>' + item + '</span></li>';
          }).join('');
        }
      });

      if (t.document_title) document.title = t.document_title;

      document.querySelectorAll('.lang-selector a[data-lang]').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-lang') === lang);
      });

      return false;
    }

    (function init() {
      const stored = localStorage.getItem('mappet_lang');
      const browserLang = navigator.language.slice(0, 2);
      const defaultLang = supported.includes(browserLang) ? browserLang : 'pt';
      const lang = (stored && supported.includes(stored)) ? stored : defaultLang;
      setLanguage(lang);
    })();
  </script>
</body>
</html>
